services:
  devopsdb:
    image: pdnsyamkumarwork/flm-java:db
    ports:
      - "3306:3306"
    volumes:
      - devopsdbdata:/var/lib/mysql
    networks:
      - mynetwork
    deploy:
      replicas: 1

  application:
    image: pdnsyamkumarwork/flm-java:javaapp
    depends_on:
      - devopsdb
    ports:
      - "1111:8080"
    deploy:
      replicas: 3

volumes:
  devopsdbdata:

networks:
  mynetwork:
    driver: overlay
