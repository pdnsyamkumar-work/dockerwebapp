services:
  devopsdb:
    image: dbimage
    ports:
      - "3306:3306"
    volumes:
      - devopsdbdata:/var/lib/mysql
      
  nexus:
    image: sonatype/nexus3:3.95.5-alpine
    ports:
      - "8081:8081"
    deploy:
      replicas: 1
    volumes:
      - nexus-data:/nexus-data

  application:
    image: appimage
    depends_on:
      - devopsdb
      - nexus
    ports:
      - "1111:8080"
    deploy:
      replicas: 3

volumes:
  devopsdbdata:
  nexus-data:
